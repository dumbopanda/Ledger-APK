syntax = "proto3";

option java_package = "com.dumbopanda.ledger.core.datastore";
option java_multiple_files = true;

// §5.6 — as in the prototype, three values. Not the auth session: that is
// EncryptedSharedPreferences (AES-256-GCM, Keystore-backed), never plain
// DataStore, per §7.3. Wired at A13 alongside sign-in, not here.
enum SyncMode {
  SYNC_MODE_UNSPECIFIED = 0;
  SYNC_MODE_SMART = 1;
  SYNC_MODE_INSTANT = 2;
  SYNC_MODE_MANUAL = 3;
}

message UserPrefs {
  SyncMode sync_mode = 1;
  // §7.13 Security. Named so proto3's zero-value default is the SPEC'S
  // default, not the opposite of it: "hide amounts (default on)" is
  // show_amounts_in_app_switcher = false, its own unset default.
  bool show_amounts_in_app_switcher = 2;
  // "Require biometric to open (default off)" -- default false needs no
  // inversion trick, unlike the field above.
  bool require_biometric_to_open = 3;
  // §7.14's nightly nudge: "no backup since the last 22:00 cutoff." 0 (proto3's
  // default) means "never backed up" -- indistinguishable from epoch, which is
  // fine, since a real backup will never actually land at exactly epoch millis.
  int64 last_backup_at_epoch_millis = 4;
  // §7.14's nudge is snoozeable; this is when a snooze expires. Same 0-means-
  // "not snoozed" reasoning as the field above.
  int64 nudge_snoozed_until_epoch_millis = 5;
}
